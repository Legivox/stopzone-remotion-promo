name: Render vertical promo

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Render vertical promo
        run: npm run render:vertical

      - name: Upload rendered preview
        uses: actions/upload-artifact@v4
        with:
          name: stopzone-vertical-preview
          path: out/stopzone-vertical.mp4
          if-no-files-found: error
          retention-days: 7
